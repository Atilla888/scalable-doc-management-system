server.port=8081

# Keycloak JWT validation — issuer matches browser tokens; JWKS fetched from Docker service name when overridden in Compose
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/dms
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8080/realms/dms/protocol/openid-connect/certs

# Keycloak Admin API — used server-side to populate the admin console.
# The secret has no default and must come from the environment.
dms.keycloak.admin.base-url=${DMS_KEYCLOAK_ADMIN_BASE_URL:http://localhost:8080}
dms.keycloak.admin.realm=${DMS_KEYCLOAK_ADMIN_REALM:dms}
dms.keycloak.admin.client-id=${DMS_KEYCLOAK_ADMIN_CLIENT_ID:dms-admin-api}
dms.keycloak.admin.client-secret=${DMS_KEYCLOAK_ADMIN_CLIENT_SECRET:}

# Actuator — expose health endpoint publicly for Docker / K8s probes
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# CORS — allow the frontend dev server (tighten in production)
dms.cors.allowed-origins=http://localhost:5173,http://localhost:80

spring.application.name=dms-backend

# MongoDB (overridden in Docker Compose to mongodb://mongodb:27017/dms)
spring.data.mongodb.uri=mongodb://localhost:27017/dms

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB

# CMIS minimal interface (Browser/JSON binding) — repository identity
dms.cmis.repository-id=dms
dms.cmis.repository-name=Hof DMS Repository
