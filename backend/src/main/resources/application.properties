server.port=8081

# Keycloak JWT validation — Spring fetches the JWKS automatically from the issuer URI
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://keycloak:8080/realms/dms

# Actuator — expose health endpoint publicly for Docker / K8s probes
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# CORS — allow the frontend dev server (tighten in production)
dms.cors.allowed-origins=http://localhost:5173,http://localhost:80

spring.application.name=dms-backend
