spring.profiles.default=dev
server.port=${SERVER_PORT:8081}

# Actuator — expose health endpoint publicly for Docker / K8s probes
management.endpoints.web.exposure.include=health,info

spring.application.name=dms-backend

# Safe defaults are also available to isolated test profiles.
spring.servlet.multipart.max-file-size=10MB
dms.upload.allowed-content-types=${DMS_ALLOWED_UPLOAD_TYPES:application/pdf,image/png,image/jpeg,text/plain,application/xml,application/json,application/vnd.openxmlformats-officedocument.wordprocessingml.document}

# CMIS minimal interface (Browser/JSON binding) — repository identity
dms.cmis.repository-id=dms
dms.cmis.repository-name=Hof DMS Repository
