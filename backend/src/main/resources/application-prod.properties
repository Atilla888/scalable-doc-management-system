# Production profile: every deployment-specific endpoint and secret is required.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI}
spring.data.mongodb.uri=${MONGODB_URI}

dms.keycloak.admin.base-url=${DMS_KEYCLOAK_ADMIN_BASE_URL}
dms.keycloak.admin.realm=${DMS_KEYCLOAK_ADMIN_REALM:dms}
dms.keycloak.admin.client-id=${DMS_KEYCLOAK_ADMIN_CLIENT_ID:dms-admin-api}
dms.keycloak.admin.client-secret=${DMS_KEYCLOAK_ADMIN_CLIENT_SECRET}

dms.cors.allowed-origins=${DMS_CORS_ALLOWED_ORIGINS}
spring.servlet.multipart.max-file-size=${DMS_MAX_FILE_SIZE:25MB}
spring.servlet.multipart.max-request-size=${DMS_MAX_REQUEST_SIZE:26MB}

management.endpoint.health.show-details=never
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
server.error.include-message=never
server.error.include-stacktrace=never
server.forward-headers-strategy=framework
