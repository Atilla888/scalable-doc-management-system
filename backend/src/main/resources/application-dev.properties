# Local development defaults. Do not use this profile for a production deployment.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/dms}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/dms/protocol/openid-connect/certs}
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/dms}

dms.keycloak.admin.base-url=${DMS_KEYCLOAK_ADMIN_BASE_URL:http://localhost:8080}
dms.keycloak.admin.realm=${DMS_KEYCLOAK_ADMIN_REALM:dms}
dms.keycloak.admin.client-id=${DMS_KEYCLOAK_ADMIN_CLIENT_ID:dms-admin-api}
dms.keycloak.admin.client-secret=${DMS_KEYCLOAK_ADMIN_CLIENT_SECRET:}

dms.cors.allowed-origins=${DMS_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:80}
spring.servlet.multipart.max-file-size=${DMS_MAX_FILE_SIZE:50MB}
spring.servlet.multipart.max-request-size=${DMS_MAX_REQUEST_SIZE:55MB}

management.endpoint.health.show-details=always
