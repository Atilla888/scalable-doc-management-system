services:

  mongodb:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in .env (see .env.example)}
      MONGO_INITDB_DATABASE: dms
      MONGO_APP_USER: ${MONGO_APP_USER:-dms_app}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?set MONGO_APP_PASSWORD in .env (see .env.example)}
    ports:
      # Published on 27018 by default (not 27017) so the stack coexists with a
      # MongoDB already running on the host's 27017. Containers always use 27017
      # on the internal network; override the host port with MONGO_HOST_PORT.
      - "127.0.0.1:${MONGO_HOST_PORT:-27018}:27017"
    volumes:
      - mongodb_data:/data/db
      - ../../scripts/mongo-init.js:/docker-entrypoint-initdb.d/01-mongo-init.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    command: start-dev --import-realm --health-enabled=true
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in .env (see .env.example)}
      KC_HTTP_PORT: 8080
      KC_MANAGEMENT_PORT: 9000
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8080
      KC_HOSTNAME_STRICT: false
      KC_HTTP_ENABLED: true
      DMS_KEYCLOAK_ADMIN_CLIENT_SECRET: ${DMS_KEYCLOAK_ADMIN_CLIENT_SECRET:?set DMS_KEYCLOAK_ADMIN_CLIENT_SECRET in .env (see .env.example)}
      DMS_DEMO_USER_PASSWORD: ${DMS_DEMO_USER_PASSWORD:?set DMS_DEMO_USER_PASSWORD in .env (see .env.example)}
    volumes:
      - ../keycloak/dms-realm.json:/opt/keycloak/data/import/dms-realm.json:ro
    ports:
      - "8080:8080"
      - "9000:9000"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: unless-stopped

  # One-shot job that runs after Keycloak is healthy and fixes what the realm
  # import cannot express: it declares the managed `department` user-profile
  # attribute (Keycloak >= 24 silently drops unmanaged attributes on import),
  # re-applies department=ITDLZ to the demo users, and verifies the token
  # mapper and service-account roles. Idempotent; the backend only starts
  # after it exits successfully.
  keycloak-bootstrap:
    # Official Debian 13 (trixie) Python image, keeping the whole stack on the
    # project's required container base.
    image: python:3.13-slim-trixie
    command: ["python", "/opt/dms/keycloak-bootstrap.py"]
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: dms
      KEYCLOAK_ADMIN_USER: ${KEYCLOAK_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in .env (see .env.example)}
    volumes:
      - ../keycloak/bootstrap/keycloak-bootstrap.py:/opt/dms/keycloak-bootstrap.py:ro
    depends_on:
      keycloak:
        condition: service_healthy
    restart: "no"

  frontend:
    build:
      context: ../../frontend
      target: dev
    ports:
      - "5173:5173"
    volumes:
      - ../../frontend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - VITE_API_BASE_URL=http://localhost:8081
      - VITE_KEYCLOAK_URL=http://localhost:8080
      - VITE_KEYCLOAK_REALM=dms
      - VITE_KEYCLOAK_CLIENT_ID=dms-frontend
      - VITE_SHOW_DEMO_USERS=true
    depends_on:
      keycloak:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: ../../backend
      target: prod
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=http://localhost:8080/realms/dms
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://keycloak:8080/realms/dms/protocol/openid-connect/certs
      - SPRING_DATA_MONGODB_URI=mongodb://${MONGO_APP_USER:-dms_app}:${MONGO_APP_PASSWORD:?set MONGO_APP_PASSWORD in .env (see .env.example)}@mongodb:27017/dms?authSource=dms
      - SERVER_PORT=8081
      - DMS_KEYCLOAK_ADMIN_BASE_URL=http://keycloak:8080
      - DMS_KEYCLOAK_ADMIN_REALM=dms
      - DMS_KEYCLOAK_ADMIN_CLIENT_ID=dms-admin-api
      - DMS_KEYCLOAK_ADMIN_CLIENT_SECRET=${DMS_KEYCLOAK_ADMIN_CLIENT_SECRET:?set DMS_KEYCLOAK_ADMIN_CLIENT_SECRET in .env (see .env.example)}
      - DMS_CORS_ALLOWED_ORIGINS=${DMS_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:80}
      - DMS_MAX_FILE_SIZE=${DMS_MAX_FILE_SIZE:-50MB}
      - DMS_MAX_REQUEST_SIZE=${DMS_MAX_REQUEST_SIZE:-55MB}
      - DMS_ALLOWED_UPLOAD_TYPES=${DMS_ALLOWED_UPLOAD_TYPES:-application/pdf,image/png,image/jpeg,text/plain,application/xml,application/json,application/vnd.openxmlformats-officedocument.wordprocessingml.document}
    depends_on:
      keycloak:
        condition: service_healthy
      keycloak-bootstrap:
        condition: service_completed_successfully
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  ocr-worker:
    build:
      context: ../../ocr-worker
    environment:
      - MONGODB_URI=mongodb://${MONGO_APP_USER:-dms_app}:${MONGO_APP_PASSWORD:?set MONGO_APP_PASSWORD in .env (see .env.example)}@mongodb:27017/dms?authSource=dms
      - OCR_POLL_INTERVAL_MS=5000
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mongodb_data:
