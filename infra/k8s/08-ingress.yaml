# Optional host-based routing via the nginx ingress controller, as an alternative to
# the default NodePort access. It requires aligning the browser-facing URLs (frontend
# build, Keycloak hostname, backend issuer/CORS, realm redirect URIs) with the token
# issuer. Set the hostnames below to match your environment before applying.
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dms-frontend
  namespace: dms
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "55m"   # match the backend upload limit
spec:
  ingressClassName: nginx
  rules:
    - host: dms.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dms-backend
  namespace: dms
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "55m"
spec:
  ingressClassName: nginx
  rules:
    - host: api.dms.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8081
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dms-keycloak
  namespace: dms
spec:
  ingressClassName: nginx
  rules:
    - host: auth.dms.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 8080
