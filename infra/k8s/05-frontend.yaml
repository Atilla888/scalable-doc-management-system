# The React app, built and served by nginx. Stateless, so two replicas.
#
# Vite bakes its config in at build time. The defaults in frontend/src/config.js
# already point at localhost:8081 (API) and localhost:8080 (Keycloak), which is exactly
# what the tunnels expose — so the plain build just works, no build args needed.
#
# dms-frontend:local comes from frontend/Dockerfile (prod target) via build-and-load.sh.
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: dms
  labels:
    app: frontend
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30573      # tunnel this to localhost:5173 on your laptop
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: dms
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: dms-frontend:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 5
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
