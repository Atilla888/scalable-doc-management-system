# Template only, don't put real passwords here and don't apply this file.
#
# The real Secret (infra/k8s/01-secrets.yaml) is made by generate-secrets.sh with
# random values and is git-ignored, so live credentials stay out of the repo. This
# file is just here to show which keys the stack expects.
#
# To create the real one:  bash infra/k8s/generate-secrets.sh
apiVersion: v1
kind: Secret
metadata:
  name: dms-secrets
  namespace: dms
type: Opaque
stringData:
  mongo-root-username: "root"            # Mongo admin, used only for init
  mongo-root-password: "<generated>"
  mongo-app-username: "dms_app"          # what the app connects as (readWrite on dms)
  mongo-app-password: "<generated>"
  keycloak-admin-username: "admin"       # Keycloak console login
  keycloak-admin-password: "<generated>"
  gitea-admin-username: "dmsadmin"       # Gitea admin + CI registry login
  gitea-admin-password: "<generated>"
  mongodb-keyfile: "<generated>"         # replica-set internal auth (HA option only)
  # gitea-runner-token is added by bootstrap.sh after Gitea is running
  # (Gitea mints the Actions runner registration token), so it is not listed here.
