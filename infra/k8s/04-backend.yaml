# The REST + CMIS API (Spring Boot). It's stateless — everything lives in MongoDB —
# so we run two replicas for headroom and so one can die without an outage.
#
# dms-backend:local is built from backend/Dockerfile and loaded into minikube by
# build-and-load.sh; IfNotPresent means we use that local image instead of pulling.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: dms
data:
  SERVER_PORT: "8081"
  # Issuer the browser's tokens carry. It's only compared, never fetched, so it has to
  # be the URL the browser uses for Keycloak (localhost:8080 via the tunnel).
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: "http://localhost:8080/realms/dms"
  # Signing keys, on the other hand, are fetched in-cluster over the service DNS name.
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: "http://keycloak:8080/realms/dms/protocol/openid-connect/certs"
  # Origins the SPA is served from (kept in sync with the realm's webOrigins).
  DMS_CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:80"
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: dms
  labels:
    app: backend
spec:
  type: NodePort
  selector:
    app: backend
  ports:
    - name: http
      port: 8081
      targetPort: 8081
      nodePort: 30081      # tunnel this to localhost:8081 on your laptop
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: dms
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: dms-backend:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: backend-config
          env:
            - name: MONGO_APP_USER
              valueFrom:
                secretKeyRef:
                  name: dms-secrets
                  key: mongo-app-username
            - name: MONGO_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dms-secrets
                  key: mongo-app-password
            # K8s drops the two values above into the connection string for us.
            - name: SPRING_DATA_MONGODB_URI
              value: "mongodb://$(MONGO_APP_USER):$(MONGO_APP_PASSWORD)@mongodb:27017/dms?authSource=dms"
          ports:
            - containerPort: 8081
              name: http
          # Give the JVM + Spring time to come up before liveness starts checking.
          startupProbe:
            httpGet:
              path: /health
              port: 8081
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            # /actuator/health stays DOWN until Mongo is reachable, so we don't send
            # traffic to a pod that can't actually serve it yet.
            httpGet:
              path: /actuator/health
              port: 8081
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            periodSeconds: 20
            failureThreshold: 5
          resources:
            requests:
              cpu: "250m"
              memory: "384Mi"
            limits:
              cpu: "1000m"
              memory: "768Mi"
