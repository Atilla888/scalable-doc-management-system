# OPTIONAL, MongoDB as a 3-member replica set with automatic primary failover.
#
# This is the High-Availability alternative to the single-node 02-mongodb.yaml.
# Apply this file INSTEAD of 02-mongodb.yaml (never both). After the pods are up,
# run init-mongodb-rs.sh once to initiate the set, create the users + indexes, and
# point the app at the replica set.
#
# How failover works: three voting members elect a primary. If the primary pod dies,
# the remaining two elect a new primary within seconds, and the MongoDB driver in the
# backend / OCR worker retries writes against it, no manual intervention, no data
# loss (each member has its own persistent volume).
#
# Members authenticate to each other with a shared keyfile (dms-secrets:mongodb-keyfile,
# created by generate-secrets.sh). An initContainer fixes the keyfile ownership/mode,
# which MongoDB is strict about.
---
# Headless service so each pod gets a stable DNS name mongodb-<n>.mongodb.dms.svc...
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: dms
  labels:
    app: mongodb
spec:
  clusterIP: None
  selector:
    app: mongodb
  ports:
    - name: mongo
      port: 27017
      targetPort: 27017
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: dms
spec:
  serviceName: mongodb
  replicas: 3
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      securityContext:
        # mongod runs as uid/gid 999 in the official image; own the volumes to match.
        fsGroup: 999
      initContainers:
        # MongoDB refuses a keyfile that is group/other-readable, and a Secret mount is
        # root-owned and read-only. Copy it to an emptyDir with mode 0400 owned by 999.
        - name: keyfile-permissions
          image: mongo:7
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              cp /secret/keyfile /keyfile/keyfile
              chmod 400 /keyfile/keyfile
              chown 999:999 /keyfile/keyfile
          volumeMounts:
            - name: keyfile-secret
              mountPath: /secret
              readOnly: true
            - name: keyfile
              mountPath: /keyfile
      containers:
        - name: mongodb
          image: mongo:7
          imagePullPolicy: IfNotPresent
          # Keep the official entrypoint (it drops to the mongodb user) but run as a
          # replica-set member with keyfile internal auth. No MONGO_INITDB_* env, so
          # user creation is handled by init-mongodb-rs.sh, not the entrypoint.
          args:
            - mongod
            - --replSet
            - rs0
            - --bind_ip_all
            - --keyFile
            - /etc/mongodb-keyfile/keyfile
          ports:
            - containerPort: 27017
              name: mongo
          volumeMounts:
            - name: data
              mountPath: /data/db
            - name: keyfile
              mountPath: /etc/mongodb-keyfile
              readOnly: true
          readinessProbe:
            # ping is allowed before authentication, so the probe needs no credentials.
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
      volumes:
        - name: keyfile-secret
          secret:
            secretName: dms-secrets
            items:
              - key: mongodb-keyfile
                path: keyfile
            defaultMode: 0400
        - name: keyfile
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
