# PodDisruptionBudgets for the stateless tier. They keep at least one replica of
# each service serving during voluntary disruptions (node drain, cluster upgrade),
# so a rolling maintenance never takes the whole service down at once. Combined with
# the two replicas each Deployment already runs, this is real, demonstrable HA for
# the parts of the system that are stateless.
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend
  namespace: dms
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: backend
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: frontend
  namespace: dms
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: frontend
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ocr-worker
  namespace: dms
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: ocr-worker
